<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimpleAgent · 可观测面板</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --muted:#8b949e; --accent:#3b82f6; --green:#3fb950; --red:#f85149;
    --amber:#d29922; --chart:#58a6ff;
  }
  [data-theme="light"]{
    --bg:#f6f8fa; --panel:#ffffff; --border:#d0d7de; --text:#1f2328;
    --muted:#656d76; --accent:#0969da; --chart:#0969da;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:16px 24px;
    border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
  header h1{font-size:16px;margin:0;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.bad{background:var(--red)}
  .dot.warn{background:#f59e0b;box-shadow:0 0 6px #f59e0b}
  .spacer{flex:1}
  .muted{color:var(--muted)}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  main{padding:24px;max-width:1200px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}
  .card h3{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em}
  .card .val{font-size:28px;font-weight:700;line-height:1.2}
  .card .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:18px;margin-bottom:20px}
  .panel h2{margin:0 0 14px;font-size:14px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:8px;background:var(--chart);border-radius:4px;min-width:2px}
  .barbg{background:var(--border);border-radius:4px;overflow:hidden;height:8px}
  svg{display:block;width:100%;height:120px}
  .spark path{fill:none;stroke:var(--chart);stroke-width:2}
  .spark .area{fill:var(--chart);opacity:.12;stroke:none}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;
    background:var(--border);color:var(--text)}
  .err{color:var(--red)}
</style>
</head>
<body>
<header>
  <span class="dot" id="healthDot"></span>
  <h1>SimpleAgent 可观测面板</h1>
  <span class="muted" id="statusText">连接中…</span>
  <span class="spacer"></span>
  <span class="muted" id="lastUpdate"></span>
  <button id="themeBtn">🌙</button>
  <button id="pauseBtn">⏸ 暂停</button>
</header>
<main>
  <div class="grid" id="kpis"></div>

  <div class="panel">
    <h2>CPU / 内存(最近 60 次采样)</h2>
    <svg class="spark" id="cpuChart" viewBox="0 0 600 120" preserveAspectRatio="none"></svg>
    <div class="muted" style="display:flex;gap:24px;margin-top:8px">
      <span>CPU: <b id="cpuNow">–</b></span>
      <span>内存: <b id="memNow">–</b></span>
    </div>
  </div>

  <div class="panel">
    <h2>成本(按模型)</h2>
    <table id="costTable"><thead><tr>
      <th>模型</th><th class="num">请求数</th><th class="num">Tokens</th><th class="num">费用</th>
    </tr></thead><tbody></tbody></table>
    <div class="muted" id="costMeta" style="margin-top:10px"></div>
  </div>

  <div class="panel">
    <h2>A2A 任务 <span class="muted" style="font-weight:400">/a2a</span></h2>
    <table id="a2aTable"><thead><tr>
      <th>taskId</th><th>状态</th><th>消息 / 错误</th><th>耗时</th>
    </tr></thead><tbody id="a2aRows"></tbody></table>
    <div class="muted" id="a2aMeta" style="margin-top:10px"></div>
  </div>

  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="panel">
      <h2>已注册工具</h2>
      <div id="toolsList"></div>
    </div>
    <div class="panel">
      <h2>LLM 连通</h2>
      <div id="llmInfo"></div>
    </div>
  </div>

  <div class="panel">
    <h2>工具韧性策略</h2>
    <div id="toolResilience" class="muted">正在加载工具重试与熔断状态…</div>
  </div>

  <div class="panel">
    <h2>会话运行时 <span class="muted" style="font-weight:400">后台任务与事件链路</span></h2>
    <div id="runtimeHint" class="muted" style="margin-bottom:10px"></div>
    <table id="jobTable"><thead><tr>
      <th>任务</th><th>状态</th><th>类型</th><th>开始时间</th><th>操作</th>
    </tr></thead><tbody id="jobRows"></tbody></table>
    <div style="margin-top:14px"><b style="font-size:13px">最近会话事件</b><div id="runtimeEvents" class="muted" style="margin-top:8px"></div></div>
  </div>

  <div class="panel">
    <h2>Prometheus 原始指标 <span class="muted" style="font-weight:400">/api/metrics</span></h2>
    <pre id="rawMetrics" style="margin:0;max-height:240px;overflow:auto;font-size:12px;
      color:var(--muted);white-space:pre-wrap"></pre>
  </div>
</main>

<script>
// 纯原生,无外部依赖。轮询自身 API,内存里滚动保存采样序列。
const cpuHist = [], memHist = [], MAX = 60;
let paused = false, timer = null;
const runtimeSession = new URLSearchParams(location.search).get('session_id') || '';

function apiHeaders(){
  const headers = {};
  const apiKey = localStorage.getItem('sa_key') || '';
  if(apiKey) headers['X-API-Key'] = apiKey;
  try{
    const auth = JSON.parse(localStorage.getItem('sa_auth') || 'null');
    if(auth && auth.user_id) headers['X-User-Id'] = auth.user_id;
    if(auth && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
  }catch(_e){ /* Ignore a malformed local development auth cache. */ }
  return headers;
}
async function jget(url){
  const r = await fetch(url, {headers: apiHeaders()});
  if(!r.ok) throw new Error(url+' → '+r.status);
  return r.json();
}
async function tget(url){
  const r = await fetch(url, {headers: apiHeaders()});
  if(!r.ok) throw new Error(url+' '+r.status); return r.text();
}
function fmt(n){ return (n==null?'–':Number(n).toLocaleString()); }
function money(n,cur){ return (n==null?'–':(cur||'¥')+Number(n).toFixed(4)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])); }
function safeInt(n, fallback=0){
  const value = Number(n);
  return Number.isFinite(value) ? value : fallback;
}
function safeNumber(n, fallback=null){
  const value = Number(n);
  return Number.isFinite(value) ? value : fallback;
}
function resultText(task){
  const content = task && task.message && task.message.content;
  if(content == null) return '';
  if(typeof content !== 'string') return JSON.stringify(content);
  const match = content.match(/(?:^|[,{]\s*)['"]content['"]\s*:\s*['"]([\s\S]*?)['"](?:\s*,|\s*})/);
  return (match ? match[1] : content).replace(/\\n/g, '\n');
}

function kpi(title,val,sub){
  return `<div class="card"><h3>${title}</h3><div class="val">${val}</div>
    <div class="sub">${sub||''}</div></div>`;
}

function drawSpark(id, data, max){
  const svg=document.getElementById(id); const W=600,H=120;
  if(!data.length){ svg.innerHTML=''; return; }
  const mx = max || Math.max(...data,1);
  const step = W/Math.max(data.length-1,1);
  const pts = data.map((v,i)=>[i*step, H-(v/mx)*(H-8)-4]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L ${W} ${H} L 0 ${H} Z`;
  svg.innerHTML = `<path class="area" d="${area}"/><path d="${line}"/>`;
}

async function tick(){
  if(paused) return;
  let health = null;
  try{
    const h = await jget('/api/health');
    health = h;
    const healthOk = h.ok !== false;
    const failedChecks = Object.entries(h.checks||{})
      .filter(([, check]) => check && check.required && check.status === 'error')
      .map(([name]) => name.toUpperCase());
    const healthDetail = failedChecks.length ? ` · ${failedChecks.join('、')} 检查失败` : '';
    document.getElementById('healthDot').className = `dot ${healthOk ? 'ok' : 'warn'}`;
    document.getElementById('statusText').textContent =
      `${healthOk ? '运行中' : '降级运行'}${healthDetail} · 版本 ${h.version} · 已运行 ${Math.floor(h.uptime_seconds/60)} 分`;

    const sess = h.sessions||{}, reqs = h.requests||{};
    const total = reqs.total||0, errs = reqs.errors||0;
    const errRate = total? ((errs/total)*100).toFixed(1)+'%':'0%';
    document.getElementById('kpis').innerHTML =
      kpi('总请求', fmt(total), `错误 ${fmt(errs)}`) +
      kpi('错误率', errRate, !healthOk?'⚠ 健康检查降级':(errs>0?'⚠ 有失败请求':'健康')) +
      kpi('活跃会话', fmt(sess.active_sessions!=null?sess.active_sessions:'–'),
          `上限 ${sess.max_sessions!=null?sess.max_sessions:'–'}`) +
      kpi('在途请求', fmt(h.inflight), '正在处理');

    const sys = h.system||{};
    if(sys.cpu_percent!=null){
      cpuHist.push(sys.cpu_percent); if(cpuHist.length>MAX)cpuHist.shift();
      memHist.push(sys.memory_percent); if(memHist.length>MAX)memHist.shift();
      drawSpark('cpuChart', cpuHist, 100);
      document.getElementById('cpuNow').textContent = sys.cpu_percent.toFixed(0)+'%';
      document.getElementById('memNow').textContent =
        sys.memory_percent.toFixed(0)+'% ('+(sys.memory_used_gb ?? '\u6682\u65e0')+' GB)';
    }

    const llm = h.llm||{};
    const llmReady = llm.status === 'ok' || (llm.reachable && !llm.error && !llm.reason);
    const llmLabel = llmReady ? '就绪' : (llm.reachable ? '服务可达但不可用' : '不可达');
    const llmDetail = llm.reason || llm.error || '';
    document.getElementById('llmInfo').innerHTML =
      `<div><span class="dot ${llmReady?'ok':'bad'}"></span>
        ${llmLabel} <span class="tag">${esc(llm.model||'未知模型')}</span></div>
       <div class="muted" style="margin-top:8px;word-break:break-all">${esc(llm.base_url||'未配置地址')}</div>
       ${llm.latency_ms!=null?`<div class="muted">延迟 ${llm.latency_ms} ms</div>`:''}
       ${llmDetail?`<div class="err">${esc(llmDetail)}</div>`:''}`;
  }catch(e){
    document.getElementById('healthDot').className='dot bad';
    document.getElementById('statusText').innerHTML=`<span class="err">${e.message}</span>`;
  }

  try{
    const c = await jget('/api/costs');
    const tb = document.querySelector('#costTable tbody');
    const rows = Object.entries(c.by_model||{});
    tb.innerHTML = rows.length? rows.map(([m,d])=>
      `<tr><td>${esc(m)}</td><td class="num">${fmt(d.request_count||d.requests)}</td>
        <td class="num">${fmt(d.total_tokens||d.tokens)}</td>
        <td class="num">${money(d.total_cost||d.cost,c.currency)}</td></tr>`).join('')
      : `<tr><td colspan="4" class="muted">暂无成本记录(发起对话后出现)</td></tr>`;
    document.getElementById('costMeta').textContent =
      `合计 ${money(c.total_cost,c.currency)} · ${fmt(c.total_tokens)} tokens · `+
      `${fmt(c.request_count)} 次调用 · 价格版本 ${c.price_version||'\u6682\u65e0'}`;
  }catch(e){ document.getElementById('costMeta').innerHTML=`<span class="err">成本接口: ${e.message}</span>`; }

  try{
    const t = await jget('/api/tools');
    const tools = t.tools || [];
    document.getElementById('toolsList').innerHTML = tools.length ? tools.map(x=>{
      const resilience = x.resilience || {};
      const state = resilience.state || 'closed';
      const failures = safeInt(resilience.consecutive_failures, 0);
      const stateLabel = state === 'open' ? '已熔断' : state === 'half_open' ? '恢复探测中' : '正常';
      const stateClass = state === 'closed' ? 'ok' : 'bad';
      return `<div style="margin-bottom:9px"><span class="tag">${esc(x.name)}</span>
        <span class="muted"> ${esc(x.description||'')}</span><br>
        <span class="muted">权限：${esc(x.permission_level||'allow')} &middot; </span>
        <span class="dot ${stateClass}"></span><span class="muted">${stateLabel}（连续瞬态失败 ${failures}）</span></div>`;
    }).join('') : '<span class="muted">未注册工具</span>';

    const policy = t.policy || (health && health.tool_resilience && health.tool_resilience.policy) || {};
    const openTools = tools
      .map(x => [x.name, x.resilience || {}])
      .filter(([, status]) => status.state && status.state !== 'closed');
    const openText = openTools.length
      ? openTools.map(([name, status]) => `${esc(name)}（${esc(status.state)}）`).join('、')
      : '无，所有已调用工具均处于正常状态';
    document.getElementById('toolResilience').innerHTML =
      `<div>默认执行超时：<strong>${fmt(policy.timeout_seconds)} 秒</strong> &middot; `+
      `只读工具最大自动重试：<strong>${fmt(policy.max_retries)} 次</strong></div>`+
      `<div style="margin-top:8px">熔断状态：${openText}</div>`+
      `<div style="margin-top:8px">说明：仅安全的只读工具会在瞬态故障时自动重试；写入或需确认工具不会自动重放。连续瞬态失败会打开该工具的独立熔断器，等待恢复窗口后仅放行一次探测调用。</div>`;
  }catch(e){
    document.getElementById('toolsList').innerHTML=`<span class="err">${esc(e.message)}</span>`;
    document.getElementById('toolResilience').innerHTML=`<span class="err">工具韧性信息加载失败：${esc(e.message)}</span>`;
  }

  try{
    const hint = document.getElementById('runtimeHint');
    const jobRows = document.getElementById('jobRows');
    const events = document.getElementById('runtimeEvents');
    if(!runtimeSession){
      hint.textContent = '要查看某次对话的后台任务与事件链路，请在地址后附加 ?session_id=会话ID。';
      jobRows.innerHTML = '<tr><td colspan="5" class="muted">尚未选择会话</td></tr>';
      events.textContent = '尚未选择会话';
    }else{
      hint.textContent = '当前会话：' + runtimeSession;
      const [jobData, eventData] = await Promise.all([
        jget('/api/jobs?session_id='+encodeURIComponent(runtimeSession)+'&limit=10'),
        jget('/api/sessions/'+encodeURIComponent(runtimeSession)+'/events?limit=12'),
      ]);
      const jobs = jobData.jobs || [];
      jobRows.innerHTML = jobs.length ? jobs.map(job=>{
        const canCancel = ['queued','running','cancel_requested'].includes(job.status);
        const action = canCancel ? `<button onclick="cancelRuntimeJob('${esc(job.job_id)}')">取消</button>` : '—';
        return `<tr><td><code>${esc(job.job_id).slice(0,18)}</code></td><td><span class="tag">${esc(job.status)}</span></td><td>${esc(job.tool_name||'')}</td><td>${job.started_at?new Date(job.started_at*1000).toLocaleTimeString():'等待中'}</td><td>${action}</td></tr>`;
      }).join('') : '<tr><td colspan="5" class="muted">当前会话没有后台任务</td></tr>';
      const rows = eventData.events || [];
      events.innerHTML = rows.length ? rows.slice().reverse().map(ev=>{
        const payload = ev.payload || {};
        const detail = payload.error_code || payload.artifact_id || payload.stop_reason || '';
        return `<div style="margin:4px 0"><span class="tag">${esc(ev.type)}</span> <code>${esc(ev.trace_id||'-')}</code> ${esc(payload.tool_name||'')} ${esc(detail)}</div>`;
      }).join('') : '当前会话还没有事件记录';
    }
  }catch(e){
    document.getElementById('runtimeHint').innerHTML = `<span class="err">运行时信息加载失败：${esc(e.message)}</span>`;
    document.getElementById('jobRows').innerHTML = '<tr><td colspan="5" class="muted">暂无数据</td></tr>';
    document.getElementById('runtimeEvents').textContent = '';
  }

  try{
    document.getElementById('rawMetrics').textContent = await tget('/api/metrics');
  }catch(e){ document.getElementById('rawMetrics').textContent = '/api/metrics: '+e.message; }

  try{
    const a = await jget('/a2a/tasks?limit=5');
    const rows = a.tasks || [];
    const a2aTag = (s) => `<span class="tag" style="background:var(--border)">${esc(s)}</span>`;
    document.getElementById('a2aRows').innerHTML = rows.length ? rows.map(t=>`
      <tr><td><code>${esc(t.taskId)}</code></td><td>${a2aTag(t.state)}</td>
        <td style="max-width:300px;word-break:break-all">${esc(resultText(t).slice(0,100))}${t.error?' <span class="err">'+esc(t.error)+'</span>':''}</td>
        <td class="num">${safeNumber(t.duration)==null?'-':safeNumber(t.duration).toFixed(1)+'s'}</td></tr>`).join('')
      : '<tr><td colspan="4" class="muted">暂无 A2A 任务</td></tr>';
    try{
      const st = await jget('/a2a/stats');
      const c = st.counters||{};
      const p = (st.local && st.local.persisted) || {};
      const persistedTotal = Object.values(p).reduce((sum, value) => sum + Number(value || 0), 0);
      const count = key => Math.max(Number(c[key] || 0), Number(p[key] || 0));
      document.getElementById('a2aMeta').textContent =
        `\u5df2\u63d0\u4ea4 ${Math.max(Number(c.submitted || 0), persistedTotal)} \u00b7 \u5df2\u5b8c\u6210 ${count('completed')} \u00b7 \u5931\u8d25 ${count('failed')} \u00b7 \u8d85\u65f6 ${count('timed_out')} \u00b7 \u5df2\u53d6\u6d88 ${count('cancelled')}`;
    }catch(e){ document.getElementById('a2aMeta').textContent='A2A 统计暂不可用'; }
  }catch(e){ document.getElementById('a2aMeta').innerHTML=`<span class="err">A2A 加载失败：${e.message}</span>`; }

  document.getElementById('lastUpdate').textContent =
    '更新于 ' + new Date().toLocaleTimeString();
}

window.cancelRuntimeJob = async function(jobId){
  if(!runtimeSession || !confirm('确认请求取消该后台任务吗？')) return;
  try{
    const response = await fetch('/api/jobs/'+encodeURIComponent(jobId)+'/cancel?session_id='+encodeURIComponent(runtimeSession), {
      method:'POST', headers:apiHeaders()
    });
    if(!response.ok) throw new Error('取消失败：'+response.status);
    tick();
  }catch(e){ alert(e.message); }
};

document.getElementById('themeBtn').onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme')==='light'?'':'light';
  document.documentElement.setAttribute('data-theme',cur);
  document.getElementById('themeBtn').textContent = cur==='light'?'☀':'🌙';
};
document.getElementById('pauseBtn').onclick = (e)=>{
  paused=!paused; e.target.textContent = paused?'▶ 继续':'⏸ 暂停';
  if(!paused) tick();
};

tick();
timer = setInterval(tick, 3000);  // 每 3 秒刷新
</script>
</body>
</html>
