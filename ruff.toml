target-version = "py311"
line-length = 120

[lint]
select = ["E", "F"]
ignore = [
    "E401",   # multiple imports on one line (common in app.py)
    "E402",   # module level import not at top
    "E501",   # line too long
    "E701",   # multiple statements on one line (colon)
    "E702",   # multiple statements on one line (semicolon)
    "E712",   # equality comparisons to True/False
    "E731",   # lambda assignment
    "E741",   # ambiguous variable name
    "F401",   # unused imports (some are conditional)
    "F541",   # f-string without placeholders
    "F811",   # redefinition (intentional in app.py)
    "F821",   # undefined name (dynamic imports)
    "F841",   # local variable assigned but not used
    "W293",   # blank line contains whitespace
]

[lint.per-file-ignores]
"test_*.py" = ["E501"]
"app.py" = ["E401", "E402", "F401", "F811", "F841"]
