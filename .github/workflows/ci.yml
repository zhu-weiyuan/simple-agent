name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv (lockfile-driven install)
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.5.x"
        enable-cache: true

    - name: Install dependencies (frozen from uv.lock)
      run: |
        uv sync --frozen --extra dev --python ${{ matrix.python-version }}
        uv pip install ruff coverage

    - name: Run linter (ruff)
      run: ruff check .

    - name: Run tests with coverage
      run: |
        uv run coverage run -m pytest --tb=short
        uv run coverage report --show-missing --fail-under=75
        uv run coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
